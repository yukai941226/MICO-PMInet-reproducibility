name: reproducibility-checks

on:
  push:
  pull_request:

jobs:
  verify:
    name: conda-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: mico-pminet
          environment-file: environment.yml
          auto-activate-base: false
          use-mamba: true
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python run.py verify
      - if: runner.os == 'Linux'
        run: python run.py select
      - if: runner.os == 'Linux'
        run: python run.py stats
      - if: runner.os == 'Linux'
        run: python run.py evaluate --repeats 2
