[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mico-pminet"
version = "1.3.0"
description = "Core reproducibility code for multi-organ ATR-FTIR PMI estimation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "MICO-PMInet authors"}]
dependencies = [
  "numpy==2.3.4",
  "pandas==2.3.3",
  "scipy==1.16.3",
  "scikit-learn==1.7.2",
  "statsmodels==0.14.5",
  "torch==2.9.1",
  "shap==0.50.0",
]

[project.scripts]
mico-pminet = "mico_pminet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
